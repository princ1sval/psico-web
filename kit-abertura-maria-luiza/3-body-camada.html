<!-- 3) Cole logo no INÍCIO do <body>, antes do header -->
<!-- ABERTURA: camada por cima do site (logo no início do <body>) -->
<div id="abertura" aria-hidden="true">
  <svg class="ab-pano" focusable="false">
    <defs>
      <clipPath id="ab-corte">
        <rect class="ab-inicial" width="100%" height="100%"/>
        <path data-borda/>
      </clipPath>
    </defs>
    <!-- sombra suave da borda: traços do mesmo path, do mais largo/claro ao mais estreito/escuro (sem filtro de blur) -->
    <g class="ab-sombra" transform="translate(0 1.5)">
      <path data-borda stroke-width="36" stroke-opacity="0.006"/>
      <path data-borda stroke-width="28" stroke-opacity="0.008"/>
      <path data-borda stroke-width="22" stroke-opacity="0.01"/>
      <path data-borda stroke-width="17" stroke-opacity="0.012"/>
      <path data-borda stroke-width="13" stroke-opacity="0.015"/>
      <path data-borda stroke-width="9" stroke-opacity="0.018"/>
      <path data-borda stroke-width="6" stroke-opacity="0.022"/>
      <path data-borda stroke-width="3" stroke-opacity="0.03"/>
    </g>
    <rect class="ab-tecido ab-inicial" width="100%" height="100%"/>
    <path class="ab-tecido" data-borda/>
    <g clip-path="url(#ab-corte)">
      <g class="ab-nome-grupo">
        <text class="ab-nome" x="50%" y="50%" text-anchor="middle" dominant-baseline="central">Maria Luiza</text>
      </g>
    </g>
    <path class="ab-fio" data-borda/>
  </svg>
  <svg class="ab-ceu" focusable="false">
    <defs>
      <linearGradient id="ab-rastro-cor" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3D4530" stop-opacity="0"/>

    </defs>
    <path class="ab-rastro" stroke="url(#ab-rastro-cor)"/>
    <g class="ab-passaro" transform="translate(-999 -999)">
      <g class="ab-asa-tras">
